name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Architectural gates
        run: ./scripts/check-gates.sh

      - name: Compile (desktop)
        run: ./gradlew :composeApp:compileKotlinDesktop

      # The real test of the java.* gate: commonMain has a second consumer from Phase 6, and a
      # desktop assumption that slipped past the grep fails here instead of on a shop floor.
      - name: Compile (Android)
        run: ./gradlew :composeApp:assembleDebug

      - name: Test
        run: ./gradlew allTests

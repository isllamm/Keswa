name: Build Desktop Installers (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows (EXE & MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure WiX Toolset is in PATH
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
              "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset --no-progress
            }
          }

      - name: Package Windows EXE and MSI Installer
        run: ./gradlew :composeApp:packageExe :composeApp:packageMsi

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: Keswa-Windows-Setup
          path: |
            composeApp/build/compose/binaries/main/exe/*
            composeApp/build/compose/binaries/main/msi/*

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/exe/*
            composeApp/build/compose/binaries/main/msi/*

  package-macos:
    name: Package macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Package macOS DMG
        run: ./gradlew :composeApp:packageDmg

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: Keswa-macOS-Setup
          path: composeApp/build/compose/binaries/main/dmg/*

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/compose/binaries/main/dmg/*

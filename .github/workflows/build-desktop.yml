name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure WiX Toolset is in PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows EXE and MSI Installer
        run: ./gradlew :composeApp:packageExe :composeApp:packageMsi

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: Keswa-Windows-Setup
          path: |
            composeApp/build/compose/binaries/main/exe/*
            composeApp/build/compose/binaries/main/msi/*

org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true

# Phase 6 — androidTarget(). Every AndroidX artefact in the graph arrives through Compose
# Multiplatform and Room, so this is a statement of fact rather than a migration setting.
android.useAndroidX=true
android.nonTransitiveRClass=true
